<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCS 자동화 목업 시뮬레이터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23101722'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%234fa3ff' stroke-width='8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>Warehouse Control System <span class="brand-sub">Live Mockup</span></h1>
        <p class="brand-desc">입고 도크배분 · 보관존 자동분류 · 피킹수단 할당 · 출고도크 자동배정</p>
      </div>
    </div>
    <div class="kpi-strip">
      <div class="kpi-tile">
        <span class="kpi-label">입고 처리량</span>
        <span class="kpi-value" id="kpi-inbound">0</span>
        <span class="kpi-unit">건/시</span>
        <svg class="kpi-spark" viewBox="0 0 84 24" preserveAspectRatio="none"><polyline id="spark-inbound" class="spark-line spark-in"></polyline></svg>
      </div>
      <div class="kpi-tile">
        <span class="kpi-label">출고 처리량</span>
        <span class="kpi-value" id="kpi-outbound">0</span>
        <span class="kpi-unit">건/시</span>
        <svg class="kpi-spark" viewBox="0 0 84 24" preserveAspectRatio="none"><polyline id="spark-outbound" class="spark-line spark-out"></polyline></svg>
      </div>
      <div class="kpi-tile">
        <span class="kpi-label">설비 가동률</span>
        <span class="kpi-value" id="kpi-util">--</span>
      </div>
      <div class="kpi-tile">
        <span class="kpi-label">오토검수 정확도</span>
        <span class="kpi-value" id="kpi-accuracy">--</span>
      </div>
    </div>
  </header>

  <div class="control-bar">
    <button id="btn-play" class="ctrl-btn primary">⏸ 일시정지</button>
    <div class="speed-group">
      <span class="ctrl-label">배속</span>
      <button class="ctrl-btn speed-btn active" data-speed="1">1x</button>
      <button class="ctrl-btn speed-btn" data-speed="2">2x</button>
      <button class="ctrl-btn speed-btn" data-speed="4">4x</button>
    </div>
    <div class="manual-group">
      <button id="btn-manual-inbound" class="ctrl-btn">+ 입고 트럭 발생</button>
      <button id="btn-manual-order" class="ctrl-btn">+ 이커머스 오더 발생</button>
    </div>
    <div class="hint">지도 위 트럭·팔레트·카트·AMR을 탭하면 상세 정보를 볼 수 있어요</div>
  </div>

  <main class="app-body">
    <div id="map-wrap" class="map-wrap">
      <svg id="wcs-map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="tooltip" class="tooltip"></div>

      <div class="legend">
        <div class="legend-item"><span class="swatch swatch-plt"></span>팔레트 (4-Way Shuttle/랙)</div>
        <div class="legend-item"><span class="swatch swatch-pcs"></span>PCS (HAIPICK Climber)</div>
        <div class="legend-item"><span class="swatch swatch-glass"></span>스마트글라스 배정 (오토검수)</div>
      </div>
    </div>

    <aside class="sidebar">
      <h2>시스템 이벤트 로그</h2>
      <div id="event-log" class="event-log"></div>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/svgMap.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
